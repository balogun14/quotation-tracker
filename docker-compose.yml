# Quotely backend: API + worker on a single VPS.
# Persistent data (SQLite + uploaded files) lives in ./data on the host.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f api
#   docker compose exec api node -e "console.log(process.version)"
#
# Required: set a strong JWT_SECRET (and RESEND_API_KEY if EMAIL_PROVIDER=resend)
# in a .env file next to this file before first start.

services:
  api:
    build: ./server
    command: ["api"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: /app/data/quotely.db
      FILE_STORAGE_DIR: /app/data/files
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: ./server
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: /app/data/quotely.db
      FILE_STORAGE_DIR: /app/data/files
    depends_on:
      - api
    volumes:
      - ./data:/app/data
